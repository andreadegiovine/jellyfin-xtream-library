name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Rebuild and upload assets for an existing release tag (e.g. v1.42.0.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      # The dispatch input is attacker-controlled text as far as this shell is concerned, so
      # it arrives through env rather than ${{ }} interpolation, and its shape is validated
      # before it can reach GITHUB_OUTPUT or actions/checkout's ref.
      - name: Determine tag
        id: tag
        env:
          EXISTING_TAG: ${{ github.event.inputs.existing_tag }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_TAG" ]; then
            TAG="$EXISTING_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # bash regex, not grep: grep matches per line, so a value carrying a newline would
          # pass and then write a second line into GITHUB_OUTPUT, poisoning this step's output.
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z.W"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.version }}

      - name: Determine assembly version
        id: asmver
        env:
          TAG: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          if [[ ! $VER =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z.W, cannot derive an assembly version"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Assembly version: ${VER}"

      # The tag is the source of truth for the shipped version, but csproj is what a
      # local `dotnet build` stamps. Fail loudly when they disagree instead of silently
      # shipping a DLL that misreports itself (v1.42.0.0 and v1.42.1.0 both shipped
      # reporting 1.41.0.0 because nothing checked). Skipped when rebuilding an existing
      # tag, since older commits legitimately predate this check.
      - name: Verify csproj version matches tag
        if: github.event.inputs.existing_tag == ''
        env:
          VER: ${{ steps.asmver.outputs.version }}
        run: |
          set -euo pipefail
          CSPROJ="Jellyfin.Xtream.Library/Jellyfin.Xtream.Library.csproj"
          CSPROJ_VER=$(sed -n 's:.*<AssemblyVersion>\(.*\)</AssemblyVersion>.*:\1:p' "$CSPROJ" | head -1)
          if [ "$CSPROJ_VER" != "$VER" ]; then
            echo "::error::AssemblyVersion in $CSPROJ is '$CSPROJ_VER' but the tag says '$VER'. Bump the csproj and re-tag."
            exit 1
          fi
          echo "csproj matches tag: $VER"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Version properties must be passed here: publish runs with --no-build, so
      # stamping at publish time alone would be a no-op.
      - name: Build
        env:
          VERSION: ${{ steps.asmver.outputs.version }}
        run: |
          set -euo pipefail
          dotnet build -c Release --no-restore \
            -p:Version="${VERSION}" \
            -p:AssemblyVersion="${VERSION}" \
            -p:FileVersion="${VERSION}"

      - name: Publish
        env:
          VERSION: ${{ steps.asmver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output
          dotnet publish Jellyfin.Xtream.Library/Jellyfin.Xtream.Library.csproj \
            -c Release \
            --no-build \
            -p:Version="${VERSION}" \
            -p:AssemblyVersion="${VERSION}" \
            -p:FileVersion="${VERSION}" \
            -o output/plugin

      # Smoke check: FileVersion is stored as a UTF-8 string in the assembly metadata,
      # so a stamped DLL literally contains the version. Catches a silently un-stamped
      # build before it is uploaded as a release asset.
      - name: Verify stamped DLL version
        env:
          EXPECTED: ${{ steps.asmver.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          expected = os.environ["EXPECTED"]
          data = pathlib.Path("output/plugin/Jellyfin.Xtream.Library.dll").read_bytes()
          found = sorted({m.decode() for m in re.findall(rb"\d+\.\d+\.\d+\.\d+", data)})
          print("Version strings in DLL:", " ".join(found))
          if expected not in found:
              sys.exit(f"::error::Built DLL does not carry version {expected}")
          print(f"DLL carries {expected}")
          PY

      # Asset name uses the numeric version (no leading "v"), because that is what the
      # sourceUrl in manifest.json / manifest-dev.json points at. Naming it after the
      # tag would 404 for every user installing from the plugin catalog.
      - name: Package
        env:
          VERSION: ${{ steps.asmver.outputs.version }}
        run: |
          set -euo pipefail
          # Only publish plugin DLL, not framework deps (Jellyfin ships those)
          cd output/plugin
          zip -j "../jellyfin-xtream-library_${VERSION}.zip" Jellyfin.Xtream.Library.dll
          cd ../..
          echo "Package size:"
          ls -lh output/*.zip

      # Every API call is status-checked. GitHub rejects a duplicate asset name, so replacing
      # means delete-then-upload, and a silently failed upload would leave a release with no
      # plugin ZIP while the job reported success. Users installing from the catalog would get
      # a 404 and nobody would know.
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.version }}
          VERSION: ${{ steps.asmver.outputs.version }}
        run: |
          set -euo pipefail
          export ASSET="jellyfin-xtream-library_${VERSION}.zip"
          ZIP="output/${ASSET}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          [ -f "$ZIP" ] || { echo "::error::Package $ZIP is missing"; exit 1; }

          # api <method> <url> [curl args...] -> body on stdout, non-2xx fails the step
          api() {
            local method="$1" url="$2"; shift 2
            local out status
            out=$(mktemp)
            status=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$@" "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::$method $url returned HTTP $status"
              cat "$out" >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          # Releases are keyed by tag, assets by numeric version. A 404 here is expected the
          # first time, so that one call tolerates a non-2xx.
          RELEASE_ID=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${API}/releases/tags/${TAG}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")

          if [ -z "$RELEASE_ID" ]; then
            echo "Release $TAG not found. Creating..."
            RELEASE_ID=$(api POST "${API}/releases" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))")
          fi

          [ -n "$RELEASE_ID" ] || { echo "::error::Could not resolve a release id for $TAG"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          EXISTING_ASSET_ID=$(api GET "${API}/releases/${RELEASE_ID}/assets" \
            | python3 -c "import sys,json,os; a=json.load(sys.stdin); n=os.environ['ASSET']; print(next((x['id'] for x in a if x['name']==n), ''))")
          if [ -n "$EXISTING_ASSET_ID" ]; then
            echo "Deleting existing asset $EXISTING_ASSET_ID ($ASSET)"
            api DELETE "${API}/releases/assets/${EXISTING_ASSET_ID}" > /dev/null
          fi

          echo "Uploading $ASSET"
          api POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET}" \
            -H "Content-Type: application/zip" \
            --data-binary @"${ZIP}" > /dev/null

          # Confirm it is actually attached, so a release can never be published assetless.
          api GET "${API}/releases/${RELEASE_ID}/assets" \
            | python3 -c "
          import sys, json, os
          assets = json.load(sys.stdin)
          name = os.environ['ASSET']
          match = next((a for a in assets if a['name'] == name), None)
          if match is None:
              sys.exit(f'::error::{name} is not attached to the release after upload')
          if match.get('state') != 'uploaded':
              sys.exit(f\"::error::{name} is in state {match.get('state')}, not 'uploaded'\")
          print(f\"{name} attached, {match['size']} bytes\")
          "
